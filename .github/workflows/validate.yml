name: Validate library

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/status.py
      - run: python scripts/build_skills.py validate
      - run: python -m unittest discover -s tests -v
      - run: |
          python scripts/export_master.py
          python scripts/build_skills.py build
          python scripts/build_site.py
          git diff --exit-code -- concepts docs exports skills .agents
